*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;color:#fff;font-family:GameFont,"Trebuchet MS",system-ui,sans-serif;font-weight:700;background:#05071c}
#app{position:absolute;left:50%;top:0;transform:translateX(-50%);overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#1d2a7a,#0b1040 55%,#05071c)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
svg{display:block}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:2.5em;color:#ffe066;text-shadow:0 .08em 0 #c46a00,0 0 .6em #ff9800;transform:scale(0);pointer-events:none;line-height:1.1}
#banner.show{animation:bn 3.4s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes bn{0%{transform:scale(0) rotate(-8deg)}28%{transform:scale(1.15) rotate(2deg)}42%{transform:scale(1)}85%{transform:scale(1)}100%{transform:scale(0)}}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8em;background:rgba(22,6,52,.6);backdrop-filter:blur(2px);text-align:center;padding:0 1em}
.hide{display:none!important}
#menu{background:rgba(22,6,52,.18);backdrop-filter:none;padding-top:14%}.mm #hud,.mm #pw{visibility:hidden}
.btn{border:.12em solid rgba(255,255,255,.9);font:inherit;font-size:1.2em;color:#fff;padding:.5em 1.6em;border-radius:2em;background:linear-gradient(#ff8fbd,#ff3f86);box-shadow:0 .25em 0 #9d1f58;cursor:pointer;min-width:9em;text-shadow:0 .08em 0 rgba(0,0,0,.25)}
.btn.alt{background:linear-gradient(#7fe3ff,#27a9e0);box-shadow:0 .25em 0 #116e9c}
.btn.gold{background:linear-gradient(#ffe680,#ffb02e);box-shadow:0 .25em 0 #a65f00;color:#4a2a00;text-shadow:none}
.btn.sm{font-size:.85em;min-width:7em;padding:.45em 1em}
.row{display:flex;gap:.8em}
#title{font-size:3.2em;line-height:1;display:flex}
#title span{display:inline-block;animation:bob 1.5s ease-in-out infinite;text-shadow:0 .07em 0 rgba(0,0,0,.35)}
@keyframes bob{50%{transform:translateY(-.16em) rotate(4deg)}}
#play{animation:pulse 1s ease-in-out infinite;font-size:1.7em}@keyframes pulse{50%{transform:scale(1.07)}}
.sub{font-size:.9em;max-width:17em;line-height:1.4;color:#f1e6ff}
.card{background:linear-gradient(#6a33ae,#3f1c78);border:.12em solid rgba(255,255,255,.4);border-radius:1.6em;padding:1.3em 1.8em;display:flex;flex-direction:column;gap:.7em;align-items:center;box-shadow:0 .4em 0 #1d0b44;animation:up .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes up{from{transform:translateY(60vh)}}
.big{font-size:2.3em;color:#ffe066;text-shadow:0 .06em 0 #b36200}
#set .card,#help .card{width:94%;max-height:92%;overflow-y:auto;touch-action:pan-y;align-items:stretch;padding:1em 1.1em;gap:.25em}
#set .big,#help .big{font-size:1.7em;align-self:center}#set .btn,#help .btn{align-self:center;margin-top:.5em}
.shead{font-size:.8em;color:#ffe066;margin-top:.7em}
.srow{display:flex;justify-content:space-between;align-items:center;gap:.6em;padding:.4em 0;border-bottom:1px solid rgba(255,255,255,.14);font-size:.85em;text-align:left}
.srow.ss{padding-left:.9em;font-size:.8em}.srow.ss.dim,.srow.sm.dim{opacity:.4}
.sw{flex:none;width:3em;height:1.65em;border-radius:1em;border:0;padding:0;position:relative;background:#5b4a85;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:.17em;left:.17em;width:1.31em;height:1.31em;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:#2fd47a}.sw.on::after{left:1.52em}
input[type=range]{width:42%;accent-color:#ffd23f;height:1.6em}

.btn:active{transform:translateY(.15em);box-shadow:none}
#hud{position:absolute;left:calc(12*var(--u));right:calc(12*var(--u));top:0;padding-top:calc(env(safe-area-inset-top,0px) + calc(14*var(--u)));pointer-events:none}#hud button{pointer-events:auto}
#top{display:flex;align-items:center;justify-content:space-between}.lf{display:flex;gap:calc(8*var(--u));width:calc(108*var(--u))}
.rb{width:calc(46*var(--u));height:calc(46*var(--u));border-radius:50%;display:grid;place-items:center;padding:0;border:calc(2.5*var(--u)) solid #3df5ff;background:rgba(255,255,255,.08);color:#3df5ff;box-shadow:0 0 calc(14*var(--u)) rgba(61,245,255,.5);cursor:pointer}.rb svg{width:calc(24*var(--u));height:calc(24*var(--u))}.rb:active{transform:scale(.94)}
#sc{text-align:center;line-height:1}#score{display:block;font-size:calc(40*var(--u));color:#fff;text-shadow:0 2px 0 rgba(0,20,60,.55),0 0 9px rgba(61,245,255,.3)}
.bs{display:block;margin-top:calc(6*var(--u));font-size:calc(20*var(--u));font-weight:500;letter-spacing:.02em;color:#ffe680;text-shadow:0 0 10px rgba(255,214,70,.55)}.bs i{font-style:normal;color:#fff;opacity:.9;margin-right:calc(6*var(--u))}.bs em{font-style:normal}
#hearts{display:flex;gap:calc(3*var(--u));width:calc(108*var(--u));justify-content:flex-end}#hearts svg{width:calc(24*var(--u));height:auto}
#st{display:flex;align-items:center;gap:calc(10*var(--u));margin-top:calc(11*var(--u));font-size:calc(20*var(--u));font-weight:500}
#st>span{padding:calc(3*var(--u)) calc(14*var(--u)) calc(4*var(--u));border-radius:99px;background:rgba(61,245,255,.1);border:calc(1.5*var(--u)) solid rgba(61,245,255,.4);line-height:1.35;white-space:nowrap}
